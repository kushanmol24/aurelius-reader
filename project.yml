
name: Aurelius

options:
  bundleIdPrefix: com.kushanmol24
  deploymentTarget:
    iOS: "17.0"

targets:
  Aurelius:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kushanmol24.aurelius
        PRODUCT_NAME: Aurelius
        INFOPLIST_KEY_CFBundleDisplayName: Aurelius
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
